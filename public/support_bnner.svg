<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)" rx="0"/>
  <!-- Cloud shapes -->
  <ellipse cx="200" cy="80" rx="70" ry="50" fill="white" opacity="0.85"/>
  <ellipse cx="155" cy="95" rx="45" ry="38" fill="white" opacity="0.8"/>
  <ellipse cx="245" cy="95" rx="45" ry="38" fill="white" opacity="0.8"/>
  <!-- Chat bubbles -->
  <circle cx="185" cy="80" r="32" fill="#F87171"/>
  <circle cx="215" cy="96" r="28" fill="#FBBF24" opacity="0.9"/>
  <!-- Question mark -->
  <text x="181" y="90" font-size="30" font-weight="900" fill="white" text-anchor="middle" font-family="Arial">?</text>
</svg>
