        <style>
          @keyframes airaPulseDot {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
          }
          .aira-loading-gif {
            width: 140px;
            max-width: 80vw;
            height: auto;
            object-fit: contain;
          }
        </style>
        <img src="/looding.gif" alt="Loading..." class="aira-loading-gif" />
        <div style="margin-top: 8px; font-weight: 700; font-size: 15px; color: #334155; letter-spacing: 0.02em; display: flex; align-items: center; gap: 4px;">
          <span>Loading</span>
          <span style="display: inline-flex; gap: 2px; color: #0284c7; font-weight: 900;">
            <span style="animation: airaPulseDot 1.2s infinite; animation-delay: 0s;">.</span>
            <span style="animation: airaPulseDot 1.2s infinite; animation-delay: 0.2s;">.</span>
            <span style="animation: airaPulseDot 1.2s infinite; animation-delay: 0.4s;">.</span>
